[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidgedb"
version = "0.1.0"
description = "Python client for VidgeDB — drive the vidgedb JSON-RPC service (line-delimited stdin/stdout) from any Python process. Zero runtime dependencies (stdlib only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "JMK" }]
keywords = [
    "vidgedb",
    "temporal",
    "graph",
    "database",
    "json-rpc",
    "digital-twin",
    "ai-agent",
    "industrial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Vidge-AI/VidgeDB/tree/main/sdk-python"
Repository = "https://github.com/Vidge-AI/VidgeDB"
Documentation = "https://github.com/Vidge-AI/VidgeDB/blob/main/sdk-python/docs/index.md"
Issues = "https://github.com/Vidge-AI/VidgeDB/issues"
"Engine (vidgeDB)" = "https://github.com/Vidge-AI/VidgeDB"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["vidgedb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
