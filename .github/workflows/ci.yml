# VidgeDB CI — triple-OS matrix (Phase 90).
#
# NOTE (deployment): the repo is currently PRIVATE / un-released, so this
# workflow does not run yet (GitHub gives no free Actions minutes on
# private repos at this scale). ACTIVATE at the first PUBLIC push: it
# picks up automatically once the repo visibility flips to public — no
# workflow changes needed.
#
# Slow-test policy: every integration test over 30 s is #[ignore]-tagged
# (phase89_finegrid, the ~497 s 24-kill probe grid — marked "CI nightly
# re-enables"); the standard `cargo test` here SKIPS the tagged set, and
# the nightly job re-runs it with `--include-ignored`.

name: ci
on:
  push:
  pull_request:

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # windows is TESTED with the SAME toolchain the release ships
          # (windows-gnu): the msvc leg failed on vendored-OpenSSL asm
          # tooling that the shipped mingw binary never needs.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: ubuntu-latest
            target: ""
          - os: macos-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: "Install mingw (windows-gnu leg)"
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Set release dir (windows-gnu puts the exe in the target triple dir)
        shell: pwsh
        run: |
          if ("${{ matrix.target }}" -ne "") {
            echo "RELDIR=target/${{ matrix.target }}/release" >> $env:GITHUB_ENV
          } else {
            echo "RELDIR=target/release" >> $env:GITHUB_ENV
          }

      - name: cargo build --release (all targets)
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --workspace --release --all-targets --target ${{ matrix.target }}
          else
            cargo build --workspace --release --all-targets
          fi

      - name: cargo test --release (VIDGEDB_BIN required by the subprocess tests)
        shell: pwsh
        run: |
          $env:VIDGEDB_BIN = "$env:GITHUB_WORKSPACE/$env:RELDIR/vidgedb"
          cargo test --workspace --release *> test-output.log
          exit $LASTEXITCODE

      - name: "Failure diagnosis (cause as readable annotations + full log artifact)"
        if: failure()
        shell: bash
        run: |
          grep -E "FAILED|panicked at|test result|error\[|error:" test-output.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload test log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test-output.log

  nightly-slow:
    # CI nightly re-enables the #[ignore]-tagged slow tests (the ~497 s
    # phase89 fine-grid and future >30 s probes). Runs on main pushes only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release (all targets)
        run: cargo build --workspace --release --all-targets

      - name: cargo test --release --include-ignored (nightly slow set)
        run: |
          export VIDGEDB_BIN="$GITHUB_WORKSPACE/target/release/vidgedb"
          cargo test --workspace --release -- --include-ignored