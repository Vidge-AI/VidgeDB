[package]
name = "vidgedb"
version = "0.1.0"
edition = "2021"
description = "VidgeDB — embedded temporal graph database for digital twins (vigilance on the edge). Single-file .vdg engine."
license = "Apache-2.0"

[dependencies]
opcua = { version = "0.12.0", default-features = false, features = [
    "server",
    "vendored-openssl",
], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
default = ["opcua"]
# The OPC-UA server surface (Phase 16). Kept ON by default so every existing
# workflow compiles unchanged; build a small core binary with
# `--no-default-features`.
opcua = ["dep:opcua"]

[dev-dependencies]
opcua = { version = "0.12.0", default-features = false, features = [
    "client",
    "vendored-openssl",
] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
